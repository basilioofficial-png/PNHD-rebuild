<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNHD — Задачи</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg-hover: #f7f7f5; --bg-comment: #fbfaf8;
    --border: #e8e7e3; --border-light: #f0eeeb;
    --text: #1a1a18; --text-secondary: #8b8880; --text-muted: #b5b3af;
    --accent: #2f6b4a; --accent-light: #edf4f0;
    --tag-bg: #f0eeeb; --done-text: #b5b3af; --radius: 6px;
    --danger: #c0392b; --danger-light: #fde8e8;
  }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* SIDEBAR */
  .sidebar { position: fixed; top: 0; left: 0; width: 240px; height: 100vh; background: var(--bg-hover); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: hidden; z-index: 20; display: flex; flex-direction: column; transition: width 0.22s ease; }
  .sidebar.collapsed { width: 52px; }
  .sidebar-logo { padding: 16px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; min-height: 60px; }
  .sidebar-logo-text { overflow: hidden; white-space: nowrap; }
  .sidebar-logo-text span { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.12em; color: var(--text); text-transform: uppercase; }
  .sidebar-logo-text small { display: block; font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .sidebar.collapsed .sidebar-logo-text { display: none; }
  .sidebar-toggle { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 4px; font-size: 16px; line-height: 1; flex-shrink: 0; transition: color 0.1s, background 0.1s; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; }
  .sidebar-toggle:hover { color: var(--text); background: var(--border); }
  .sidebar.collapsed .sidebar-toggle { margin: 0 auto; }

  /* Sync dot */
  .sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); margin-left: 6px; vertical-align: middle; transition: background 0.3s; }
  .sync-dot.syncing { background: #f0a500; }
  .sync-dot.ok { background: var(--accent); }
  .sync-dot.error { background: var(--danger); }

  /* Nav labels — hide when collapsed */
  .nav-label { overflow: hidden; white-space: nowrap; transition: opacity 0.15s; flex: 1; min-width: 0; }
  .sidebar.collapsed .nav-label { opacity: 0; width: 0; }
  .sidebar.collapsed .nav-count { display: none; }
  .sidebar.collapsed .nav-delete { display: none; }

  .nav-section { padding: 16px 20px 6px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; white-space: nowrap; overflow: hidden; }
  .sidebar.collapsed .nav-section { padding: 12px 0 4px; text-align: center; font-size: 8px; letter-spacing: 0; }
  .nav-lists { flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 13.5px; color: var(--text-secondary); cursor: pointer; transition: background 0.12s, color 0.12s; text-decoration: none; position: relative; user-select: none; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 8px 0; width: 52px; gap: 0; }
  .nav-item:hover { background: var(--border-light); color: var(--text); }
  .nav-item:hover .nav-delete { opacity: 1; }
  .nav-item.active { background: var(--border); color: var(--text); font-weight: 500; }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); border-radius: 0 2px 2px 0; }
  .nav-count { margin-left: auto; font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); background: var(--border); padding: 1px 6px; border-radius: 10px; min-width: 20px; text-align: center; flex-shrink: 0; }
  .nav-delete { opacity: 0; transition: opacity 0.1s; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 13px; padding: 0 2px; margin-left: 4px; }
  .nav-delete:hover { color: var(--danger); }
  .nav-add-list { display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 13px; color: var(--text-muted); cursor: pointer; transition: color 0.12s; border-top: 1px solid var(--border-light); margin-top: 4px; white-space: nowrap; overflow: hidden; }
  .sidebar.collapsed .nav-add-list { justify-content: center; padding: 8px 0; width: 52px; gap: 0; }
  .nav-add-list:hover { color: var(--accent); }
  .nav-add-list-label { overflow: hidden; white-space: nowrap; }
  .sidebar.collapsed .nav-add-list-label { display: none; }
  .nav-bottom { border-top: 1px solid var(--border); padding: 8px 0; }
  .nav-filter-item { display: flex; align-items: center; gap: 8px; padding: 5px 14px; font-size: 13px; color: var(--text-muted); cursor: pointer; transition: background 0.1s, color 0.1s; white-space: nowrap; overflow: hidden; }
  .sidebar.collapsed .nav-filter-item { justify-content: center; padding: 6px 0; width: 52px; gap: 0; }
  .nav-filter-item:hover { background: var(--border-light); color: var(--text); }
  .nav-filter-item.active-filter { color: var(--accent); font-weight: 500; }
  .nav-filter-label { overflow: hidden; white-space: nowrap; }
  .sidebar.collapsed .nav-filter-label { display: none; }

  /* Main shifts with sidebar */
  .main { margin-left: 240px; min-height: 100vh; transition: margin-left 0.22s ease; }
  .main.collapsed { margin-left: 52px; }

  /* Mobile overlay */
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 15; }
  @media (max-width: 768px) {
    .sidebar { width: 240px; left: -240px; transition: left 0.22s ease; box-shadow: none; }
    .sidebar.mobile-open { left: 0; box-shadow: 4px 0 20px rgba(0,0,0,0.12); }
    .sidebar.collapsed { width: 240px; left: -240px; }
    .main { margin-left: 0 !important; }
    .main.collapsed { margin-left: 0 !important; }
    .sidebar-overlay { display: block; opacity: 0; pointer-events: none; transition: opacity 0.22s; }
    .sidebar-overlay.open { opacity: 1; pointer-events: all; }
    .mobile-toggle { display: flex !important; }
  }
  .mobile-toggle { display: none; position: fixed; top: 12px; left: 12px; z-index: 30; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; font-size: 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .stats-row { display: flex; gap: 24px; padding: 16px 48px; border-bottom: 1px solid var(--border); background: var(--bg-hover); }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500; }
  .stat-value.green { color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .progress-bar-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .progress-bar-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .topbar { position: sticky; top: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 14px 48px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
  .topbar-title { font-family: 'Lora', serif; font-size: 18px; font-weight: 500; }
  .topbar-meta { font-size: 12px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
  .content { padding: 40px 48px 80px; max-width: 820px; }
  .list-block { margin-bottom: 48px; }
  .list-header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .list-title { font-family: 'Lora', serif; font-size: 22px; font-weight: 500; }
  .list-subtitle { font-size: 12px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
  .list-progress { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); }
  .list-header-spacer { flex: 1; }
  .list-link-btn { font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--accent); text-decoration: none; border: 1px solid var(--accent); padding: 2px 10px; border-radius: 4px; white-space: nowrap; transition: background 0.1s; }
  .list-link-btn:hover { background: var(--accent-light); }
  .list-delete-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 13px; padding: 3px 6px; border-radius: 4px; transition: color 0.1s, background 0.1s; }
  .list-delete-btn:hover { color: var(--danger); background: var(--danger-light); }
  .task { border-bottom: 1px solid var(--border-light); }
  .task-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 8px; border-radius: var(--radius); transition: background 0.1s; position: relative; }
  .task-row:hover { background: var(--bg-hover); }
  .task-row:hover .task-actions { opacity: 1; }
  .checkbox { width: 16px; height: 16px; min-width: 16px; border: 1.5px solid var(--border); border-radius: 3px; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: var(--bg); cursor: pointer; }
  .checkbox:hover { border-color: var(--accent); }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .checkbox.checked::after { content: ''; width: 9px; height: 5px; border-left: 1.5px solid white; border-bottom: 1.5px solid white; transform: rotate(-45deg) translateY(-1px); display: block; }
  .task-body { flex: 1; min-width: 0; }
  .task-text { font-size: 14px; line-height: 1.5; color: var(--text); }
  .task-text.done { color: var(--done-text); text-decoration: line-through; }
  .task-note { font-size: 12px; color: var(--text-muted); margin-top: 2px; line-height: 1.5; }
  .task-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-muted); min-width: 20px; margin-top: 3px; user-select: none; }
  .task-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tag { font-size: 11px; font-family: 'IBM Plex Mono', monospace; padding: 1px 7px; border-radius: 3px; background: var(--tag-bg); color: var(--text-muted); }
  .tag.waiting { background: #fef3e2; color: #b07b2a; }
  .tag.urgent { background: #fde8e8; color: #c0392b; }
  .tag.dev { background: #e8f0fe; color: #3b5bdb; }
  .tag.seo { background: #e8f4f0; color: #2f6b4a; }
  .task-actions { opacity: 0; transition: opacity 0.1s; display: flex; align-items: center; gap: 2px; margin-top: 2px; }
  .action-btn { background: none; border: none; cursor: pointer; padding: 3px 7px; border-radius: 4px; font-size: 12px; color: var(--text-muted); transition: background 0.1s, color 0.1s; white-space: nowrap; font-family: 'IBM Plex Sans', sans-serif; }
  .action-btn:hover { background: var(--border); color: var(--text); }
  .action-btn.danger:hover { background: var(--danger-light); color: var(--danger); }
  .comment-badge { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); }
  .subtasks { margin-left: 46px; margin-bottom: 2px; }
  .subtask { display: flex; align-items: flex-start; gap: 8px; padding: 5px 8px; border-radius: var(--radius); cursor: pointer; transition: background 0.1s; }
  .subtask:hover { background: var(--bg-hover); }
  .subtask:hover .subtask-del { opacity: 1; }
  .subtask .checkbox { width: 13px; height: 13px; min-width: 13px; border-radius: 50%; margin-top: 3px; }
  .subtask-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; flex: 1; }
  .subtask-text.done { color: var(--done-text); text-decoration: line-through; }
  .subtask-del { opacity: 0; transition: opacity 0.1s; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 12px; padding: 1px 4px; }
  .subtask-del:hover { color: var(--danger); }
  .add-subtask-row { display: flex; align-items: center; gap: 6px; padding: 4px 8px; margin-left: 21px; }
  .add-subtask-input { flex: 1; border: none; border-bottom: 1px dashed var(--border); padding: 3px 0; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; color: var(--text); background: transparent; outline: none; }
  .add-subtask-input:focus { border-color: var(--accent); }
  .add-subtask-input::placeholder { color: var(--text-muted); }
  .comments-area { margin-left: 46px; margin-bottom: 8px; display: none; }
  .comments-area.open { display: block; }
  .comment { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border-light); }
  .comment-avatar { width: 22px; height: 22px; min-width: 22px; border-radius: 50%; background: var(--accent-light); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--accent); margin-top: 1px; font-family: 'IBM Plex Mono', monospace; }
  .comment-content { flex: 1; }
  .comment-meta { font-size: 11px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; margin-bottom: 3px; }
  .comment-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .comment-delete { background: none; border: none; cursor: pointer; font-size: 11px; color: var(--text-muted); padding: 2px 4px; border-radius: 3px; margin-left: auto; opacity: 0; transition: opacity 0.1s; }
  .comment:hover .comment-delete { opacity: 1; }
  .comment-delete:hover { color: var(--danger); background: var(--danger-light); }
  .comment-input-row { display: flex; gap: 8px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--border-light); }
  .comment-input { flex: 1; border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; color: var(--text); background: var(--bg-comment); outline: none; transition: border-color 0.15s; resize: none; min-height: 36px; }
  .comment-input:focus { border-color: var(--accent); background: var(--bg); }
  .comment-input::placeholder { color: var(--text-muted); }
  .comment-submit { background: var(--accent); color: white; border: none; border-radius: var(--radius); padding: 7px 14px; font-size: 12px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; cursor: pointer; transition: opacity 0.15s; align-self: flex-end; }
  .comment-submit:hover { opacity: 0.85; }
  .empty-comments { padding: 10px 0 6px; font-size: 12px; color: var(--text-muted); font-style: italic; }
  .add-task-row { display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: var(--radius); margin-top: 4px; }
  .add-task-input { flex: 1; border: none; border-bottom: 1px solid var(--border); padding: 5px 0; font-size: 14px; font-family: 'IBM Plex Sans', sans-serif; color: var(--text); background: transparent; outline: none; transition: border-color 0.15s; }
  .add-task-input:focus { border-color: var(--accent); }
  .add-task-input::placeholder { color: var(--text-muted); }
  .add-task-btn { background: var(--accent); color: white; border: none; border-radius: var(--radius); padding: 5px 12px; font-size: 12px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; }
  .add-task-btn:hover { opacity: 0.85; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--bg); border-radius: 10px; padding: 28px 32px; width: 420px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,0.12); transform: translateY(8px); transition: transform 0.15s; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title { font-family: 'Lora', serif; font-size: 18px; font-weight: 500; margin-bottom: 20px; }
  .modal-field { margin-bottom: 14px; }
  .modal-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; margin-bottom: 6px; display: block; }
  .modal-input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-size: 14px; font-family: 'IBM Plex Sans', sans-serif; color: var(--text); background: var(--bg); outline: none; transition: border-color 0.15s; }
  .modal-input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel { background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 16px; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; color: var(--text-muted); cursor: pointer; }
  .btn-cancel:hover { background: var(--bg-hover); }
  .btn-primary { background: var(--accent); color: white; border: none; border-radius: var(--radius); padding: 7px 16px; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; cursor: pointer; }
  .btn-primary:hover { opacity: 0.85; }
  .task-text[contenteditable="true"],
  .task-note[contenteditable="true"],
  .subtask-text[contenteditable="true"],
  .list-title[contenteditable="true"],
  .list-subtitle[contenteditable="true"] {
    outline: none;
    border-radius: 3px;
    background: var(--accent-light);
    padding: 1px 4px;
    margin: -1px -4px;
    cursor: text;
  }
  .edit-hint { font-size: 11px; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; margin-left: 6px; opacity: 0; transition: opacity 0.1s; }
  .list-header:hover .edit-hint { opacity: 1; }
  .task-row:hover .edit-hint { opacity: 1; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">Новый список</div>
    <div class="modal-field">
      <label class="modal-label">Название</label>
      <input class="modal-input" id="modal-name" type="text" placeholder="Например: Маркетинг" onkeydown="if(event.key==='Enter')confirmModal()">
    </div>
    <div class="modal-field">
      <label class="modal-label">Подпись (необязательно)</label>
      <input class="modal-input" id="modal-subtitle" type="text" placeholder="Например: сайт или команда" onkeydown="if(event.key==='Enter')confirmModal()">
    </div>
    <div class="modal-field">
      <label class="modal-label">Ссылка (необязательно)</label>
      <input class="modal-input" id="modal-link" type="text" placeholder="https://..." onkeydown="if(event.key==='Enter')confirmModal()">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-primary" onclick="confirmModal()">Создать</button>
    </div>
  </div>
</div>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>
<button class="mobile-toggle" onclick="openMobileSidebar()">☰</button>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-text">
      <span>PNHD <span class="sync-dot" id="sync-dot"></span></span>
      <small>Управление задачами</small>
    </div>
    <button class="sidebar-toggle" onclick="toggleSidebar()" id="sidebar-toggle-btn" title="Свернуть меню">◀</button>
  </div>
  <div class="nav-section">Списки</div>
  <div class="nav-lists" id="nav-lists"></div>
  <div class="nav-add-list" onclick="openNewListModal()"><span style="font-size:16px;line-height:1;flex-shrink:0">+</span><span class="nav-add-list-label"> Новый список</span></div>
  <div class="nav-bottom">
    <div class="nav-section" style="padding-top:8px">Фильтр</div>
    <div class="nav-filter-item active-filter" id="filter-all" onclick="setFilter('all')"><span>🔵</span><span class="nav-filter-label"> Все задачи</span></div>
    <div class="nav-filter-item" id="filter-open" onclick="setFilter('open')"><span>⬜</span><span class="nav-filter-label"> Открытые</span></div>
    <div class="nav-filter-item" id="filter-done" onclick="setFilter('done')"><span>✅</span><span class="nav-filter-label"> Выполненные</span></div>
  </div>
</nav>

<div class="main">
  <div class="stats-row">
    <div class="stat"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Всего</div></div>
    <div class="stat"><div class="stat-value green" id="stat-done">0</div><div class="stat-label">Выполнено</div></div>
    <div class="stat"><div class="stat-value" id="stat-open">0</div><div class="stat-label">Открытых</div></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="global-progress" style="width:0%"></div></div>
      <div style="font-size:11px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;" id="progress-label">0% выполнено</div>
    </div>
  </div>
  <div class="topbar">
    <div class="topbar-title">Задачи проекта</div>
    <div class="topbar-meta" id="date-display"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
// ─── SUPABASE CONFIG ──────────────────────────────────────────────────────────
const SB_URL = 'https://yynacowbkrhgbcpdeeej.supabase.co';
const SB_KEY = 'sb_publishable_7DasDsUdbn2u_xXWvkbZFw_Z-4VDqqA';

async function sbFetch(path, options = {}) {
  const res = await fetch(SB_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || '',
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

let checks = {};   // { task_id: { done } }
let comments = {}; // { task_id: [{ id, text, created_at }] }

// ─── SUPABASE LOAD ────────────────────────────────────────────────────────────
async function loadFromSupabase() {
  setSyncStatus('syncing');
  try {
    const [checksData, commentsData, listsData] = await Promise.all([
      sbFetch('checks?select=*'),
      sbFetch('comments?select=*&order=created_at.asc'),
      sbFetch('custom_lists?select=*&order=updated_at.asc'),
    ]);

    checks = {};
    (checksData || []).forEach(r => { checks[r.task_id] = { done: r.done }; });

    comments = {};
    (commentsData || []).forEach(r => {
      if (!comments[r.task_id]) comments[r.task_id] = [];
      comments[r.task_id].push(r);
    });

    // Если в базе есть списки — используем их
    // Если нет — первый запуск, записываем статические данные
    if (listsData && listsData.length > 0) {
      allListsData = listsData.map(r => ({ ...r, tasks: r.tasks || [] }));
    } else {
      // Первый запуск — сидируем базу статическими списками
      allListsData = STATIC_LISTS.map(l => ({ ...l }));
      await Promise.all(STATIC_LISTS.map(list =>
        sbFetch('custom_lists', {
          method: 'POST',
          headers: { 'Prefer': 'resolution=merge-duplicates' },
          body: JSON.stringify({ id: list.id, title: list.title, subtitle: list.subtitle || '', link: list.link || '', tasks: list.tasks, updated_at: new Date().toISOString() })
        })
      ));
    }

    setSyncStatus('ok');
  } catch(e) {
    console.error('Load error:', e);
    setSyncStatus('error');
    // Fallback — показываем статические данные
    allListsData = STATIC_LISTS.map(l => ({ ...l }));
  }
  renderAll();
  updateStats();
}

}

async function addComment(taskId, text) {
  if (!text.trim()) return;
  setSyncStatus('syncing');
  try {
    const result = await sbFetch('comments', {
      method: 'POST',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify({ task_id: taskId, text: text.trim() })

    setSyncStatus('ok');
    renderComments(taskId);
    updateStats();
  } catch(e) { console.error(e); setSyncStatus('error'); }

  if (!comments[taskId]) return;
  comments[taskId] = comments[taskId].filter(c => c.id !== commentId);
  renderComments(taskId); updateStats();
  setSyncStatus('syncing');
  try {
    await sbFetch('comments?id=eq.' + commentId, { method: 'DELETE' });
    setSyncStatus('ok');
  } catch(e) { console.error(e); setSyncStatus('error'); }

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

function renderComments(taskId) {
  const area = document.getElementById('comments-' + taskId);
  if (!area) return;
  const list = comments[taskId] || [];
  let html = '';
  if (!list.length) html += '<div class="empty-comments">Нет комментариев</div>';
  else list.forEach(c => {
    html += '<div class="comment"><div class="comment-avatar">В</div><div class="comment-content"><div class="comment-meta">' + formatDate(c.created_at) + '</div><div class="comment-text">' + esc(c.text) + '</div></div><button class="comment-delete" onclick="deleteComment(\'' + taskId + '\',\'' + c.id + '\',event)">✕</button></div>';
  });
  html += '<div class="comment-input-row"><textarea class="comment-input" id="cinput-' + taskId + '" placeholder="Добавить комментарий..." rows="1" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();submitComment(\'' + taskId + '\');}"></textarea><button class="comment-submit" onclick="submitComment(\'' + taskId + '\')">Отправить</button></div>';
  area.innerHTML = html;
  const badge = document.getElementById('badge-' + taskId);
  if (badge) badge.textContent = list.length > 0 ? list.length + ' коммент.' : '';
}

function toggleComments(taskId, e) {
  if (e) e.stopPropagation();
  const area = document.getElementById('comments-' + taskId);
  if (!area) return;
  area.classList.toggle('open');
  if (area.classList.contains('open')) { renderComments(taskId); setTimeout(() => { const i = document.getElementById('cinput-' + taskId); if(i) i.focus(); }, 50); }

function submitComment(taskId) {
  const inp = document.getElementById('cinput-' + taskId);

  const text = inp.value; inp.value = '';

}

// ─── INLINE EDITING ───────────────────────────────────────────────────────────
function makeEditable(el, onSave) {
  el.contentEditable = 'true';
  el.focus();
  // place cursor at end
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  function save() {
    el.contentEditable = 'false';
    onSave(el.textContent.trim());
  }
  el.addEventListener('keydown', function handler(e) {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') { el.contentEditable = 'false'; el.removeEventListener('keydown', handler); }
  });
  el.addEventListener('blur', save, { once: true });
}

    if (!newText) return;
    const list = allListsData.find(l => l.id === listId);
    if (!list) return;
    const task = list.tasks.find(t => t.id === taskId);
    if (task) task.text = newText;
    await saveList(listId);
    renderAll(); updateStats();
  });
}

async function editTaskNote(taskId, listId) {
  const el = document.getElementById('tnote-' + taskId);
  if (!el) return;
  if (!el.textContent.trim()) el.textContent = 'Добавить заметку...';
  makeEditable(el, async (newNote) => {
    const list = allListsData.find(l => l.id === listId);
    if (!list) return;
    const task = list.tasks.find(t => t.id === taskId);
    if (task) task.note = newNote === 'Добавить заметку...' ? '' : newNote;
    await saveList(listId);
    renderAll(); updateStats();
  });
}

async function editSubtaskText(taskId, subId, listId) {
  const el = document.getElementById('stext-' + subId);
  if (!el) return;
  makeEditable(el, async (newText) => {
    if (!newText) return;
    const list = allListsData.find(l => l.id === listId);
    if (!list) return;
    const task = list.tasks.find(t => t.id === taskId);
    if (!task) return;
    const sub = task.subtasks.find(s => s.id === subId);
    if (sub) sub.text = newText;
    await saveList(listId);
    renderAll(); updateStats();
  });
}

async function editListTitle(listId) {
  const el = document.getElementById('ltitle-' + listId);
  if (!el) return;
  makeEditable(el, async (newTitle) => {
    if (!newTitle) return;
    const list = allListsData.find(l => l.id === listId);

async function editListSubtitle(listId) {

// ─── RENDER ───────────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderTask(task, i, listId) {
  const done = checks[task.id] ? checks[task.id].done : false;
  const cc = (comments[task.id] || []).length;
  const tagHtml = (task.tags || []).map(tag => '<span class="tag ' + tag + '">' + (TAG_LABELS[tag]||tag) + '</span>').join('');
  const hide = (currentFilter === 'done' && !done) || (currentFilter === 'open' && done) ? 'style="display:none"' : '';

  let html = '<div class="task" id="twrap-' + task.id + '" ' + hide + '>';
  html += '<div class="task-row">';
  html += '<div class="task-num">' + (i+1) + '.</div>';
  html += '<div class="checkbox ' + (done?'checked':'') + '" onclick="toggleDone(\'' + task.id + '\',event)"></div>';
  html += '<div class="task-body">';
  html += '<div class="task-text ' + (done?'done':'') + '" id="ttext-' + task.id + '" ondblclick="editTaskText(\'' + task.id + '\',\'' + listId + '\')" title="Двойной клик — редактировать">' + esc(task.text) + '</div>';
  html += '<div class="task-note" id="tnote-' + task.id + '" ondblclick="editTaskNote(\'' + task.id + '\',\'' + listId + '\')" title="Двойной клик — редактировать заметку">' + (task.note ? esc(task.note) : '<span style="color:var(--border);font-size:11px">двойной клик — добавить заметку</span>') + '</div>';
  if (tagHtml) html += '<div class="task-tags">' + tagHtml + '</div>';
  html += '</div>';
  html += '<div class="task-actions">';
  html += '<button class="action-btn" onclick="toggleComments(\'' + task.id + '\',event)">💬 <span id="badge-' + task.id + '" class="comment-badge">' + (cc>0?cc+' коммент.':'') + '</span></button>';
  html += '<button class="action-btn danger" onclick="deleteTask(\'' + listId + '\',\'' + task.id + '\',event)">Удалить</button>';
  html += '</div></div>';

  if (task.subtasks && task.subtasks.length) {
    html += '<div class="subtasks">';
    task.subtasks.forEach(sub => {
      const sd = checks[sub.id] ? checks[sub.id].done : false;
      html += '<div class="subtask">' +
        '<div class="checkbox ' + (sd?'checked':'') + '" onclick="toggleDone(\'' + sub.id + '\',event)"></div>' +
        '<div class="subtask-text ' + (sd?'done':'') + '" id="stext-' + sub.id + '" onclick="toggleDone(\'' + sub.id + '\',event)" ondblclick="event.stopPropagation();editSubtaskText(\'' + task.id + '\',\'' + sub.id + '\',\'' + listId + '\')" title="Двойной клик — редактировать">' + esc(sub.text) + '</div>' +
        '<button class="subtask-del" onclick="deleteSubtask(\'' + task.id + '\',\'' + sub.id + '\',\'' + listId + '\',event)">✕</button>' +
        '</div>';
    });
    html += '</div>';
  }
  html += '<div class="subtasks"><div class="add-subtask-row"><input class="add-subtask-input" id="newsub-' + task.id + '" placeholder="+ подзадача" onkeydown="addSubtask(\'' + task.id + '\',\'' + listId + '\',event)"></div></div>';
  html += '<div class="comments-area" id="comments-' + task.id + '"></div>';
  html += '</div>';
  return html;
}

function renderListBlock(list) {
  const { done, total } = countDone(list.tasks);
  let html = '<div class="list-block" id="list-' + list.id + '">';
  html += '<div class="list-header">';
  html += '<div class="list-title" id="ltitle-' + list.id + '" ondblclick="editListTitle(\'' + list.id + '\')" title="Двойной клик — редактировать">' + esc(list.title) + '</div>';
  html += '<div class="list-subtitle" id="lsub-' + list.id + '" ondblclick="editListSubtitle(\'' + list.id + '\')" title="Двойной клик — редактировать подпись">' + (list.subtitle ? esc(list.subtitle) : '') + '</div>';
  html += '<div class="list-progress" id="progress-' + list.id + '">' + done + '/' + total + '</div>';
  html += '<span class="edit-hint">✎ двойной клик</span>';
  html += '<div class="list-header-spacer"></div>';
  if (list.link) html += '<a class="list-link-btn" href="' + list.link + '" target="_blank">&#x2197; Таблица</a>';
  html += '<button class="list-delete-btn" onclick="deleteList(\'' + list.id + '\',event)" title="Удалить список">✕</button>';
  html += '</div>';
  list.tasks.forEach((task, i) => { html += renderTask(task, i, list.id); });
  html += '<div class="add-task-row"><input class="add-task-input" id="newtask-' + list.id + '" placeholder="Добавить задачу..." onkeydown="if(event.key===\'Enter\')addTaskToList(\'' + list.id + '\')"><button class="add-task-btn" onclick="addTaskToList(\'' + list.id + '\')">+ Задача</button></div>';
  html += '</div>';
  return html;
}

function renderNav() {
  const nav = document.getElementById('nav-lists');
  nav.innerHTML = allListsData.map(list => {
    const { done, total } = countDone(list.tasks);
    const icon = list.id==='pnhd'?'📋':list.id==='studio'?'🎨':list.id==='tematika'?'🏷':list.id==='seo'?'🔍':'📁';
    return '<a class="nav-item" href="#list-' + list.id + '">' +
      '<span style="flex-shrink:0">' + icon + '</span>' +
      '<span class="nav-label">' + esc(list.title) + '</span>' +
      '<span class="nav-count" id="nav-count-' + list.id + '">' + (total-done) + '</span>' +
      '<button class="nav-delete" onclick="deleteList(\'' + list.id + '\',event)">✕</button>' +
      '</a>';
  }).join('');
  nav.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.querySelector(a.getAttribute('href'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      nav.querySelectorAll('a').forEach(n => n.classList.remove('active'));
      a.classList.add('active');
      closeMobileSidebar();
    });
  });
}

// ─── SIDEBAR TOGGLE ───────────────────────────────────────────────────────────
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const main = document.querySelector('.main');
  const btn = document.getElementById('sidebar-toggle-btn');
  const collapsed = sidebar.classList.toggle('collapsed');
  main.classList.toggle('collapsed', collapsed);
  btn.textContent = collapsed ? '▶' : '◀';
  btn.title = collapsed ? 'Развернуть меню' : 'Свернуть меню';
  localStorage.setItem('pnhd_sidebar', collapsed ? '1' : '0');
}

function openMobileSidebar() {
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebar-overlay').classList.add('open');
}

function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// restore sidebar state
(function() {
  if (localStorage.getItem('pnhd_sidebar') === '1') {
    const sidebar = document.getElementById('sidebar');
    const main = document.querySelector('.main');
    const btn = document.getElementById('sidebar-toggle-btn');
    if (sidebar) sidebar.classList.add('collapsed');
    if (main) main.classList.add('collapsed');
    if (btn) { btn.textContent = '▶'; btn.title = 'Развернуть меню'; }
  }
})();

function renderAll() {
  document.getElementById('content').innerHTML = allListsData.map(renderListBlock).join('');
  renderNav();
}

function countDone(tasks) {
  let done = 0, total = 0;
  tasks.forEach(t => {
    total++; if (checks[t.id] && checks[t.id].done) done++;
    (t.subtasks||[]).forEach(s => { total++; if (checks[s.id] && checks[s.id].done) done++; });
  });
  return { done, total };
}

function updateStats() {
  let td = 0, ta = 0;
  allListsData.forEach(list => { const { done, total } = countDone(list.tasks); td += done; ta += total; });
  document.getElementById('stat-total').textContent = ta;
  document.getElementById('stat-done').textContent = td;
  document.getElementById('stat-open').textContent = ta - td;
  const pct = ta ? Math.round(td/ta*100) : 0;
  document.getElementById('global-progress').style.width = pct + '%';
  document.getElementById('progress-label').textContent = pct + '% выполнено';
  allListsData.forEach(list => {
    const { done, total } = countDone(list.tasks);
    const nc = document.getElementById('nav-count-' + list.id);
    if (nc) nc.textContent = total - done;
    const pr = document.getElementById('progress-' + list.id);
    if (pr) pr.textContent = done + '/' + total;
  });
}

function setFilter(mode) {
  currentFilter = mode;
  ['all','open','done'].forEach(m => document.getElementById('filter-'+m).classList.toggle('active-filter', m===mode));
  allListsData.forEach(list => list.tasks.forEach(task => {
    const wrap = document.getElementById('twrap-' + task.id);
    if (!wrap) return;
    const done = checks[task.id] ? checks[task.id].done : false;
    if (mode === 'done' && !done) wrap.style.display = 'none';
    else if (mode === 'open' && done) wrap.style.display = 'none';
    else wrap.style.display = '';
  }));
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('date-display').textContent = new Date().toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });

loadFromSupabase();
</script>
